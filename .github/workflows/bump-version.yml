name: bump-version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump version
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Update and commit version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          bash scripts/update-version.sh "$BUMP_TYPE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "Bump $BUMP_TYPE version"
          git push origin "HEAD:$GITHUB_REF"
